version: 2
updates:
  # action を SHA で pin しているため、更新はここからしか降りてこない。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
# ci.yml の markdownlint-cli は run: 内で版数を固定しているため dependabot の
# 監視外になる。更新は手動で行う。
