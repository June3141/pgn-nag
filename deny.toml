# 依存のライセンスと既知の脆弱性を見る。
# 許可の一覧に無いライセンスの依存が入ると CI が落ちる (ADR-0013)。

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
# 既知の脆弱性が報告されている依存を拒否する
yanked = "deny"

[licenses]
# 本体が GPL-3.0-or-later なので、これと両立するものだけを許可する。
# 一覧に無いライセンスは deny される。増やすときは両立性を確認すること。
# 使われていない許可を warning にしない。将来の依存を見越して並べているため
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
]

[bans]
# 同じ crate の複数版が混ざると、どの版が使われるか追いにくくなる
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
