[package]
name = "pgn-nag"
version = "0.1.0"
edition = "2024"
# 依存解決の下限。edition 2024 の resolver と dependabot がこの値を見るため、
# ビルドに使う toolchain とは役割が別になる。rust-toolchain.toml の channel を
# 上げるときに併せて上げること。下回ると解決できない依存が入り込む
rust-version = "1.93"
description = "PGN を UCI エンジンで一括解析し、注釈付き PGN として読み返すツール"
# ライセンス未定のうちは publish させない (crates.io へ誤って公開しないための歯止め)
publish = false

[[bin]]
name = "nag"
path = "src/main.rs"
