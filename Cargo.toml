[package]
name = "pgn-nag"
version = "0.1.0"
edition = "2024"
# 依存解決の下限。edition 2024 の resolver と dependabot がこの値を見るため、
# ビルドに使う toolchain とは役割が別になる。rust-toolchain.toml の channel を
# 上げるときに併せて上げること。下回ると解決できない依存が入り込む
rust-version = "1.98"
description = "PGN を UCI エンジンで一括解析し、注釈付き PGN として読み返すツール"
# ライセンス未定のうちは publish させない (crates.io へ誤って公開しないための歯止め)
publish = false

[lib]
name = "pgn_nag"
path = "src/lib.rs"

[[bin]]
name = "nag"
path = "src/main.rs"

# 閾値は clippy.toml にある。どちらも既定では無効な lint なので、ここで
# 有効にしないとゲートが効かない (ADR-0010)
[lints.clippy]
cognitive_complexity = "deny"
too_many_lines = "deny"

[dependencies]
pgn-reader = "0.29"
shakmaty = "0.30"
