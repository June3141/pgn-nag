# ビルドに使う toolchain の唯一の定義。
# rustup は cargo 実行時にこのファイルを優先するため、CI 側で版数を指定しても
# 実際のビルドはここが決める。CI にも書くと片方だけ古いまま気付けなくなる。
# dependabot は このファイルを更新しないので channel の更新は手動になる。
# 上げるときは Cargo.toml の rust-version も併せて上げること。
[toolchain]
channel = "1.93.0"
components = ["rustfmt", "clippy"]
# rust-cache は ~/.rustup を対象にせず、toolchain は毎ジョブ取得される。
# minimal にして components に挙げたものだけを落とす
profile = "minimal"
